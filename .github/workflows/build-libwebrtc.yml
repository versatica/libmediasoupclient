name: Build libwebrtc

# Runs manually when the libwebrtc version (branch-heads/7339, m140) needs to
# be updated. Produces a GitHub Release with pre-built artifacts consumed by
# the test workflow.

on:
    workflow_dispatch:
        inputs:
            os:
                description: OS to build for
                required: true
                default: all
                type: choice
                options:
                    - all
                    - ubuntu-24.04
                    - macos-15

env:
    WEBRTC_BRANCH: branch-heads/7339
    WEBRTC_REVISION: m140

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # ubuntu-24.04 is the latest Ubuntu version supported by ./build/install-build-deps.sh.
                    - os: ubuntu-24.04
                      artifact: libwebrtc-linux-x64
                      gn_args: >-
                          is_debug=false
                          is_component_build=false
                          is_clang=false
                          rtc_include_tests=false
                          rtc_use_h264=true
                          use_rtti=true
                          use_custom_libcxx=false
                          treat_warnings_as_errors=false
                          use_ozone=true

                    - os: macos-15
                      artifact: libwebrtc-macos-arm64
                      gn_args: >-
                          is_debug=false
                          is_component_build=false
                          is_clang=true
                          rtc_include_tests=false
                          rtc_use_h264=true
                          use_rtti=true
                          use_custom_libcxx=false

        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        if: inputs.os == 'all' || inputs.os == matrix.os

        steps:
            - name: Install depot_tools
              run: |
                  git clone --depth 1 \
                    https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                    "${{ runner.temp }}/depot_tools"
                  echo "${{ runner.temp }}/depot_tools" >> $GITHUB_PATH

            - name: Fetch WebRTC
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir webrtc-checkout && cd webrtc-checkout
                  fetch --nohooks webrtc

            - name: Checkout ${{ env.WEBRTC_BRANCH }} (${{ env.WEBRTC_REVISION }})
              working-directory: ${{ runner.temp }}/webrtc-checkout/src
              run: |
                  git checkout -b ${{ env.WEBRTC_REVISION }} refs/remotes/${{ env.WEBRTC_BRANCH }}
                  gclient sync

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              working-directory: ${{ runner.temp }}/webrtc-checkout/src
              run: sudo ./build/install-build-deps.sh --no-prompt

            - name: Generate build files
              working-directory: ${{ runner.temp }}/webrtc-checkout/src
              run: gn gen out/${{ env.WEBRTC_REVISION }} --args='${{ matrix.gn_args }}'

            - name: Build
              working-directory: ${{ runner.temp }}/webrtc-checkout/src
              run: ninja -C out/${{ env.WEBRTC_REVISION }}

            - name: Package artifact
              working-directory: ${{ runner.temp }}/webrtc-checkout/src
              run: |
                  ARTIFACT_DIR="${{ runner.temp }}/artifact"
                  mkdir -p "${ARTIFACT_DIR}"

                  # Static library.
                  cp out/${{ env.WEBRTC_REVISION }}/obj/libwebrtc.a "${ARTIFACT_DIR}/"

                  # Headers: all .h files under src/, preserving directory structure,
                  # excluding the build output directory.
                  find . -name "*.h" ! -path "./out/${{ env.WEBRTC_REVISION }}/*" \
                    | tar czf "${ARTIFACT_DIR}/include.tar.gz" -T -

                  # Final tarball.
                  tar czf "${{ runner.temp }}/${{ matrix.artifact }}.tar.gz" \
                    -C "${{ runner.temp }}" artifact/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
                  retention-days: 7

    release:
        name: Publish Release
        needs: build
        runs-on: ubuntu-26.04
        permissions:
            contents: write

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/

            - name: Create or replace release
              run: |
                  gh release delete webrtc-${{ env.WEBRTC_REVISION }} \
                    --repo ${{ github.repository }} --yes 2>/dev/null || true

                  gh release create webrtc-${{ env.WEBRTC_REVISION }} \
                    --repo ${{ github.repository }} \
                    --title "libwebrtc ${{ env.WEBRTC_REVISION }} (${{ env.WEBRTC_BRANCH }})" \
                    --notes "Pre-built libwebrtc static library and headers used by the CI test workflow." \
                    artifacts/libwebrtc-linux-x64/libwebrtc-linux-x64.tar.gz \
                    artifacts/libwebrtc-macos-arm64/libwebrtc-macos-arm64.tar.gz
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
