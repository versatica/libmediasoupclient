name: CI

on:
    push:
        branches: [v3]
    pull_request:
        paths:
            - "src/**"
            - "test/**"
    workflow_dispatch:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install clang-format
              run: |
                  sudo apt-get update
                  # Try to install clang-format-22, fallback to latest available
                  sudo apt-get install -y clang-format-22 || sudo apt-get install -y clang-format

            - name: Check clang-format version
              run: clang-format --version

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint
